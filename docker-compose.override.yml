version: '3.1'
services:
  banjir_mysql:
    image: mysql:8.0
    container_name: banjir_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banjir_db
    ports:
      - "3306:3306"
    volumes:
      - banjir_mysql_data:/var/lib/mysql
    restart: always

volumes:
  banjir_mysql_data:
